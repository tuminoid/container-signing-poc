# The ClusterPolicy this repository ran for legacy Cosign signatures before
# Kyverno 1.20, with its digest settings spelled out. ../cosign-v2.mk enforces
# it on Kyverno 1.19, ../cosign-v3.mk alone and next to
# kyverno-policy-cosign.yaml, its ImageValidatingPolicy replacement; README.md
# has the mapping. `make api-versions` asserts that Kyverno 1.20 refuses it.
# __TRUST__ becomes the root CA, see ../common.mk.
apiVersion: kyverno.io/v2beta1
kind: ClusterPolicy
metadata:
  name: check-image-cosign-legacy
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
  - name: verify-signature-cosign
    match:
      any:
      - resources:
          kinds:
          - Pod
    verifyImages:
    - type: Cosign
      imageReferences:
      - "*:5000/alpine*"
      mutateDigest: true
      verifyDigest: true
      required: true
      attestors:
      - count: 1
        entries:
        - certificates:
            rekor:
              ignoreTlog: true
            ctlog:
              ignoreSCT: true
            certChain: |-
              __TRUST__
