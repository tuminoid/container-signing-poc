# Sigstore bundles bound to their repository, one policy per repository: a
# bundle signs the digest alone, so each policy requires the repository
# annotation that cosign-v4-pre v4-repo-binding signs into the subject. The
# bundle of bundle/app, copied into bundle/other, carries repository app and
# is denied there. __TRUST__ as in kyverno-policy-bundle.yaml.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: check-image-bundle-app
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "pods/ephemeralcontainers"]
  matchImageReferences:
  - glob: "*:5000/bundle/app:*"
  - glob: "*:5000/bundle/app@*"
  - glob: "*:5000/bundle/app"
  attestors:
  - name: cosign
    cosign:
      ctlog:
        insecureIgnoreTlog: true
        insecureIgnoreSCT: true
      keyless:
        identities:
        - subjectRegExp: ".*"
          issuerRegExp: ".*"
      annotations:
        repository: app
      trustedRoot:
        value: |-
          __TRUST__
  validations:
  - expression: >-
      (images.containers + images.initContainers +
      images.ephemeralContainers).map(image,
      verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
    message: image is not signed for repository app
---
apiVersion: policies.kyverno.io/v1
