# Cosign legacy signatures (cosign-v2, cosign-v3) against a private CA, with
# no transparency log. The PEM block is replaced by the flow's CA, see
# common.mk.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: check-image-cosign
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchImageReferences:
  - glob: "kind-registry:5000/alpine*"
  attestors:
  - name: cosign
    cosign:
      ctlog:
        insecureIgnoreTlog: true
        insecureIgnoreSCT: true
      certificate:
        certChain:
          value: |-
            -----BEGIN CERTIFICATE-----
            replaced with the root CA certificate
            -----END CERTIFICATE-----
  validations:
  - expression: >-
      images.containers.map(image,
      verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
    message: image is not signed by the configured CA
