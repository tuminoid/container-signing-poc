# Notation signatures against a private CA. __TRUST__ becomes the root CA,
# see common.mk.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: check-image-notation
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "pods/ephemeralcontainers"]
  matchImageReferences:
  - glob: "*:5000/busybox*"
  attestors:
  - name: notary
    notary:
      certs:
        value: |-
          __TRUST__
  validations:
  - expression: >-
      (images.containers + images.initContainers +
      images.ephemeralContainers).map(image,
      verifyImageSignatures(image, [attestors.notary])).all(e, e > 0)
    message: image is not signed by the configured CA
